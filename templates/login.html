<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión Administrativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen text-slate-200">
    <div class="bg-slate-800 p-8 rounded-3xl shadow-xl max-w-sm w-full border border-slate-700">
        <h2 class="text-2xl font-black text-center mb-6 text-green-400">Acceso Autoadministrable</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-500/20 text-red-300 p-3 rounded-xl mb-4 text-sm text-center border border-red-500/30 font-semibold">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-4">
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-400">Contraseña del Sistema</label>
                <input type="password" name="password" required class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 outline-none text-white focus:border-green-500">
            </div>
            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 font-bold p-4 rounded-xl text-slate-950 transition">
                Ingresar al Panel
            </button>
        </form>
        <a href="/" class="block text-center text-xs mt-4 text-slate-500 hover:underline">Regresar al inicio</a>
    </div>
</body>
</html>
